# How to test this project:
# 1. Run: docker compose up -d
# 2. Check containers: docker compose ps
# 3. Visit http://localhost in your browser (or run: curl http://localhost)
#    You should see: "Hello from middleware! (container: ...)"
# 4. If not working, check logs:
#    docker compose logs -f nginx
#    docker compose logs -f middleware
#    docker compose logs -f mysql
# 5. Ensure all containers are running and healthy.

services:
  mysql:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: examplepass
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app_net

  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: appuser
      DB_PASS: apppass
      DB_NAME: appdb
    depends_on:
      - mysql
    networks:
      - app_net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - middleware
    networks:
      - app_net

volumes:
  mysql-data:

networks:
  app_net:
    driver: bridge
